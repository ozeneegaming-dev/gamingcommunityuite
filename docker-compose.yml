name: redline

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runner
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - gcsconfig:/app/config

  # Joburile în fundal (BullMQ): expirarea VIP, reguli de realizări, promovări. Așteaptă singur instalarea.
  worker:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: worker
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - gcsconfig:/app/config

  # Socket.io (notificări, chat, prezență, topicuri live), pe portul intern 4000; Caddy trimite `/socket.io/*` aici.
  realtime:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: realtime
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - gcsconfig:/app/config

  # Traducerea automată (LibreTranslate), doar intern, fără port public: butonul „Traduce” de la conținut.
  # Modelele (≈1–2 GB) se descarcă la prima pornire, în volumul `ltdata`.
  translate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,ro,de,es,fr,ru
    volumes:
      - ltdata:/home/libretranslate/.local

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio nu mai e publicat pe Docker Hub; Chainguard construiește MinIO din sursă.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - realtime
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GCS_DOMAIN: ${GCS_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  ltdata:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
  gcsconfig:
