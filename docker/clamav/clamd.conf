# ClamAV pentru aplicația Descărcări (GamingCommunitySuite): serviciul `clamav` din docker-compose.yml.
# Aplicația trimite fișierele prin TCP (INSTREAM) la clamav:3310; limitele de mai jos acoperă fișierele de 200 MB
# (limita implicită a Descărcărilor) și arhivele lor, scanate pe dinăuntru.
Foreground yes
LogTime yes
LogFile /var/log/clamav/clamd.log
PidFile /tmp/clamd.pid
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

# Fluxul trimis de aplicație și fișierele din arhive.
StreamMaxLength 400M
MaxFileSize 400M
MaxScanSize 1000M
MaxRecursion 16
MaxFiles 20000
ScanArchive yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
# Un fișier peste limite nu e marcat „infectat”; aplicația îl tratează ca „neverificat” (după setarea din ACP).
AlertExceedsMax no

# Mai multe scanări odată (încărcări în paralel), fără să blocheze verificarea semnăturilor noi.
MaxThreads 4
ConcurrentDatabaseReload yes
