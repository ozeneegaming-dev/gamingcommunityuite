// GCS Server Bridge — configul pluginului AMX Mod X (addons/amxmodx/configs/gcs_bridge.cfg).
// Cheia API se creează în ACP → Gaming → Servere → serverul → Plugin și chei API (se arată o singură dată).

// Adresa site-ului, fără calea protocolului (HTTPS recomandat).
gcs_url "https://comunitate.exemplu.ro"

// Cheia serverului: gcs1.<keyId>.<secret>. Nu o publica: cine o are poate scrie date în numele serverului.
gcs_key ""

// Câmpul din setinfo cu parola adminilor pe nume (setinfo _pw parola).
gcs_password_field "_pw"

// 1 = cine intră cu numele unui admin fără parola corectă e dat afară („nume rezervat”).
gcs_name_protect 1

// 1 = amx_ban / amx_unban merg prin GCS (dezactivează alte pluginuri de ban sau pune 0).
gcs_amx_aliases 1

// Ready-up-ul simplu al meciurilor mix (say /ready), jucătorii necesari și numărul maxim de runde.
gcs_mix_ready 0
gcs_mix_players 10
gcs_mix_maxrounds 30

// 1 = jurnalul cererilor în logs (fără chei sau semnături).
gcs_debug 0
