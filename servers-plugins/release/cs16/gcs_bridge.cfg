// GCS Server Bridge — configul pluginului AMX Mod X (addons/amxmodx/configs/gcs_bridge.cfg).
// Implicit pluginul DOAR COLECTEAZĂ DATE pentru site: nu atinge adminii, bannurile sau comenzile serverului.

// Adresa site-ului, fără calea protocolului (HTTPS recomandat).
gcs_url "https://comunitate.exemplu.ro"

// Cheia serverului: gcs1.<keyId>.<secret>. Goală = pluginul se înrolează singur, iar adminul îl aprobă în ACP
// (cheia primită se salvează în gcs_bridge_key.cfg). Nu o publica: cine o are poate scrie date în numele serverului.
gcs_key ""

// 0 = pluginul rămâne doar colector, orice module opționale s-ar porni în ACP (admini, bannuri, VIP, ready-up, comenzi).
gcs_allow_manage 1

// Modulul „Admini din GCS”: câmpul din setinfo cu parola adminilor pe nume (setinfo _pw parola) și protecția numelui
// (1 = cine intră cu numele unui admin fără parola corectă e dat afară).
gcs_password_field "_pw"
gcs_name_protect 1

// Modulul „Comenzile de admin GCS”: 1 = amx_ban / amx_unban merg prin GCS (pune 0 dacă alt plugin de bannuri le tratează).
gcs_amx_aliases 1

// Meciurile mix: jucătorii necesari pentru ready-up și numărul de runde când mp_maxrounds e 0.
gcs_mix_players 10
gcs_mix_maxrounds 30

// 1 = jurnalul cererilor în logs (fără chei sau semnături).
gcs_debug 0
